name: ci

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 23 * * 0,1,4'

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        build-type: [RelWithDebInfo]
        compiler: [gcc]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: jrl-umi3218/github-actions/install-dependencies@master
        with:
          compiler: ${{ matrix.compiler }}
          build-type: ${{ matrix.build-type }}
          ubuntu: |
            apt-mirrors:
              ros:
                mirror: http://packages.ros.org/ros2/ubuntu
                key-uri: https://raw.githubusercontent.com/ros/rosdistro/master/ros.key
              mc-rtc:
                cloudsmith: mc-rtc/head
            apt: libmc-rtc-dev clang-tidy
          ros: |
            apt: ros-base mc-rtc-plugin xacro

      # ── Pre-commit (clang-format, cmake-format, ...) ──
      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Build ROS description packages
        run: |
          set -ex
          source "/opt/ros/${ROS_DISTRO:-humble}/setup.bash"

          sudo apt update
          sudo apt install -y curl gnupg2 lsb-release ca-certificates

          sudo mkdir -p /etc/apt/keyrings
          curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.asc \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/ros-archive-keyring.gpg > /dev/null

          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/ros-archive-keyring.gpg] \
          http://packages.ros.org/ros2/ubuntu \
          $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null

          sudo apt update
          sudo apt install -y ros-${ROS_DISTRO}-ros-base

      # ── mc_rtc ──
      - name: Install mc_rtc
        run: |
          set -e

          curl -1sLf 'https://dl.cloudsmith.io/public/mc-rtc/head/setup.deb.sh' | sudo -E bash

          sudo apt update
          sudo apt install -y -qq \
            libmc-rtc-dev \
            ros-${ROS_DISTRO}-mc-rtc-plugin \
            ros-${ROS_DISTRO}-xacro \
            clang-tidy

      # ── ROS2 description packages (cached) ──
      - name: Cache ROS2 workspace
        id: cache-ros2
        uses: actions/cache@v4
        with:
          path: /tmp/ros2_ws
          key: ros2-ws-${{ hashFiles('dependencies.repos') }}

      - name: Install ROS description packages
        if: steps.cache-ros2.outputs.cache-hit != 'true'
        run: |
          set -e
          source /opt/ros/${ROS_DISTRO}/setup.bash
          sudo apt install -y python3-colcon-common-extensions python3-vcstool

          mkdir -p /tmp/ros2_ws/src
          vcs import --shallow --input dependencies.repos /tmp/ros2_ws/src

          cd /tmp/ros2_ws
          colcon build --packages-select \
            bota_driver \
            robotiq_description \
            robotiq_hande_description

          # Expose the overlay to `build-cmake-project` and the ctest it runs.
          . install/setup.bash
          {
            echo "AMENT_PREFIX_PATH=${AMENT_PREFIX_PATH}"
            echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH:-}"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
          } >> "${GITHUB_ENV}"

      # ── Build & test ──
      - name: Build and test
        uses: jrl-umi3218/github-actions/build-cmake-project@master
        with:
          compiler: ${{ matrix.compiler }}
          build-type: ${{ matrix.build-type }}
          options: >-
            -DWITH_BOTA_SENSOR=ON
            -DWITH_DS4=ON
            -DWITH_PLATE=ON
            -DWITH_REALSENSE_CAMERA=ON
            -DWITH_ROBOTIQ_GRIPPER=ON
            -DWITH_SCREW=ON
            -DWITH_SSG48_GRIPPER=ON

      - name: Run clang-tidy
        run: |
          pre-commit run clang-tidy --all-files --hook-stage manual
