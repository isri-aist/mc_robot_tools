name: ci

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 23 * * 0,1,4'

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        build-type: [RelWithDebInfo]
        compiler: [gcc]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: jrl-umi3218/github-actions/install-dependencies@master
        with:
          compiler: ${{ matrix.compiler }}
          build-type: ${{ matrix.build-type }}
          ubuntu: |
            apt-mirrors:
              ros:
                mirror: http://packages.ros.org/ros2/ubuntu
                key-uri: https://raw.githubusercontent.com/ros/rosdistro/master/ros.key
              mc-rtc:
                cloudsmith: mc-rtc/head
            apt: libmc-rtc-dev clang-tidy
          ros: |
            apt: ros-base mc-rtc-plugin xacro robotiq-description

      # ── Pre-commit (clang-format, cmake-format, ...) ──
      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Build ROS description packages
        run: |
          set -eux
          source "/opt/ros/${ROS_DISTRO:-humble}/setup.bash"

          mkdir -p "${GITHUB_WORKSPACE}/description_ws/src"
          cd "${GITHUB_WORKSPACE}/description_ws/src"
          git clone --depth 1 https://gitlab.com/botasys/drivers/bota_driver_ros2
          git clone --depth 1 https://github.com/Lass6230/ssg48_adaptive_electric_gripper_ros2

          cd "${GITHUB_WORKSPACE}/description_ws"
          colcon build --merge-install \
            --packages-select bota_driver ssg48_gripper_description \
            --cmake-args -DBUILD_NODES=OFF -DBUILD_TESTING=OFF

          # Expose the overlay to `build-cmake-project` and the ctest it runs.
          . install/setup.bash
          {
            echo "AMENT_PREFIX_PATH=${AMENT_PREFIX_PATH}"
            echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH:-}"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
          } >> "${GITHUB_ENV}"

      # ── Build & test ──
      - name: Build and test
        uses: jrl-umi3218/github-actions/build-cmake-project@master
        with:
          compiler: ${{ matrix.compiler }}
          build-type: ${{ matrix.build-type }}
          options: >-
            -DWITH_BOTA_SENSOR=ON
            -DWITH_DS4=ON
            -DWITH_PLATE=ON
            -DWITH_REALSENSE_CAMERA=ON
            -DWITH_ROBOTIQ_GRIPPER=ON
            -DWITH_SCREW=ON
            -DWITH_SSG48_GRIPPER=ON

      - name: Run clang-tidy
        run: |
          pre-commit run clang-tidy --all-files --hook-stage manual
